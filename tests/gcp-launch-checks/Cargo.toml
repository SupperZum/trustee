[package]
name = "gcp-launch-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[features]
default = ["launch-gcp-credentials"]
launch-gcp-credentials = []
[dependencies]
policy-engine = {package="onb17-trustee-policy-capture-checks",path="../launch-policy-capture",features=["capture"]}
verifier = {path="../../deps/verifier",default-features=false,features=["execution-quote-worker-tdx"]}
execution-proof-contract = {path="../../../execution-proof-prototype/contract"}
execution-proof-verifier = {path="../../../execution-proof-prototype/verifier"}
execution-proof-client = {path="../../../execution-proof-prototype/client"}
credential-jwe = {package="onb17-jwe-source-checks",path="../launch-policy-capture/jwe-leaf"}
key-value-storage = {path="../../deps/key-value-storage",default-features=false}
actix-web = {version="=4.14.0",default-features=false,features=["macros"]}
anyhow = "=1.0.103"
async-trait = "=0.1.89"
base64 = "=0.22.1"
hex = "=0.4.3"
kbs-types = "=0.15.0"
serde = {version="=1.0.228",features=["derive"]}
serde_json = "=1.0.150"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.10.9"
ring = "=0.17.14"
tokio = {version="=1.52.3",features=["rt-multi-thread","macros"]}
regorus = {version="=0.10.1",default-features=false,features=["std","regex","base64","time"]}
zeroize = "=1.9.0"
regex = "=1.13.0"
openssl = "=0.10.81"
prometheus = "=0.14.0"
rsa = {version="=0.9.10",features=["sha2"]}
[lints.rust]
unexpected_cfgs = {level="warn",check-cfg=['cfg(feature,values("aws","gcp","vault","aliyun"))']}

[dev-dependencies]
rstest = "=0.26.1"
