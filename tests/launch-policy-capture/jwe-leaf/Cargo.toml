[package]
name = "onb17-jwe-source-checks"
version = "0.1.0"
edition = "2021"
publish = false

# Compile the KBS JWE implementation as a library; exclude its inline tests.
[lib]
name = "credential_jwe"
path = "../../../kbs/src/jwe.rs"
test = false

[dependencies]
aes-gcm = { version = "=0.11.0", features = ["zeroize", "arrayvec", "getrandom"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
polyval = { version = "=0.6.2", features = ["zeroize"] }
aes-kw = "=0.3.1"
anyhow = "=1.0.103"
base64 = "=0.22.1"
kbs-types = "=0.15.0"
openssl = "=0.10.81"
p256 = { version = "=0.13.2", features = ["ecdh"] }
p521 = { version = "=0.13.3", features = ["ecdh"] }
rsa = { version = "=0.9.10", features = ["sha2"] }
serde_json = "=1.0.150"
tracing = "=0.1.44"
zeroize = "=1.9.0"
